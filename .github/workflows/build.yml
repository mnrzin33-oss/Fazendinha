name: Build & Verify

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Copy local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Lint check
        run: ./gradlew core:check 2>&1 || true
        continue-on-error: true

      - name: Build APK
        run: ./gradlew android:assembleDebug

      - name: Verify APK exists
        run: |
          APK=$(find android/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          echo "APK built successfully: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fazendinha-APK
          path: android/build/outputs/apk/debug/*.apk
          retention-days: 90

      - name: Manage Tags (keep max 2)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const tags = await github.rest.repos.listTags({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            const buildTags = tags.data
              .filter(t => t.name.startsWith('v'))
              .sort((a, b) => parseInt(b.name.replace('v', '')) - parseInt(a.name.replace('v', '')));

            if (buildTags.length >= 2) {
              for (const tag of buildTags.slice(2)) {
                console.log(`Deleting: ${tag.name}`);
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${tag.name}`
                });
                try {
                  const releases = await github.rest.repos.listReleases({
                    owner: context.repo.owner,
                    repo: context.repo.repo
                  });
                  const r = releases.data.find(r => r.tag_name === tag.name);
                  if (r) {
                    await github.rest.repos.deleteRelease({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      release_id: r.id
                    });
                  }
                } catch (e) {}
              }
            }

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: android/build/outputs/apk/debug/*.apk
          draft: true
